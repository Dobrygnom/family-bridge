name: build-desktop

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            platform: windows
            arch: x64
          - os: macos-15-intel
            artifact: macos-x64
            platform: macos
            arch: x64
          - os: macos-latest
            artifact: macos-arm64
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install official Codex CLI for the Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CODEX_NON_INTERACTIVE: "1"
        run: |
          Invoke-RestMethod https://chatgpt.com/codex/install.ps1 | Invoke-Expression
          "CODEX_CLI_PATH=$env:USERPROFILE\.codex\packages\standalone\current\bin\codex.exe" >> $env:GITHUB_ENV
      - name: Install official Codex CLI for the macOS bundle
        if: runner.os == 'macOS'
        env:
          CODEX_NON_INTERACTIVE: "1"
        run: |
          curl -fsSL https://chatgpt.com/codex/install.sh | sh
          echo "CODEX_CLI_PATH=$HOME/.local/bin/codex" >> "$GITHUB_ENV"
      - if: runner.os == 'Windows'
        run: npm run package -- --${{ matrix.arch }}
      - if: runner.os == 'macOS'
        run: npm run package -- --${{ matrix.arch }}
      - name: Verify packaged state (no UI or personal data)
        run: node scripts/verify-packaged-state.mjs
      - name: Verify local crash dumps in isolated test processes
        run: node scripts/verify-crash-capture.mjs
      - name: Record complete build artifact checksums
        env:
          FAMILY_BRIDGE_BUILD_ARCH: ${{ matrix.arch }}
        run: node scripts/checksum-build-artifacts.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: family-bridge-${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
            release/build-SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify downloaded artifacts against original builds
        run: |
          for platform in windows-x64 macos-x64 macos-arm64; do
            (cd "artifacts/family-bridge-$platform" && sha256sum --check --strict build-SHA256SUMS.txt) || exit 1
          done
      - name: Merge architecture-specific macOS update feeds
        run: node scripts/merge-mac-update-feeds.mjs artifacts/family-bridge-macos-x64/latest-mac.yml artifacts/family-bridge-macos-arm64/latest-mac.yml artifacts/latest-mac.yml
      - name: Generate checksums
        run: |
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed -E 's#  artifacts/[^/]+/#  #' > artifacts/SHA256SUMS.txt
      - name: Prepare draft release for final artifact verification
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.blockmap
            artifacts/family-bridge-windows-x64/latest.yml
            artifacts/latest-mac.yml
            artifacts/SHA256SUMS.txt
